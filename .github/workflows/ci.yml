name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      run: mvn clean package -Pweb-app

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: dostavimvse-jar
        path: target/dostavimvse-*.jar
        retention-days: 7

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download JAR artifact
      uses: actions/download-artifact@v4
      with:
        name: dostavimvse-jar
        path: target/

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

    - name: Deploy to server
      env:
        SERVER_HOST: ${{ secrets.SERVER_HOST }}
        SERVER_USER: ${{ secrets.SERVER_USER }}
        DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      run: |
        SERVER_USER="${SERVER_USER:-ubuntu}"
        DEPLOY_PATH="${DEPLOY_PATH:-/opt/dostavimvse/app}"
        
        echo "🚀 Deploying to server: $SERVER_HOST"
        echo "👤 User: $SERVER_USER"
        echo "📁 Path: $DEPLOY_PATH"
        echo "📦 JAR file: $(ls -lh target/dostavimvse-*.jar | awk '{print $5, $9}')"
        
        # Создание директорий на сервере
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST \
          "mkdir -p $DEPLOY_PATH && mkdir -p $DEPLOY_PATH/backup"
        
        # Резервная копия старого JAR (если существует)
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST \
          "if [ -f $DEPLOY_PATH/dostavimvse.jar ]; then \
            cp $DEPLOY_PATH/dostavimvse.jar $DEPLOY_PATH/backup/dostavimvse.jar.\$(date +%Y%m%d_%H%M%S); \
            echo '✅ Backup created'; \
          fi" || true
        
        # Копирование JAR файла
        echo "📤 Uploading JAR file..."
        scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no target/dostavimvse-*.jar \
          $SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/dostavimvse.jar
        
        # Проверка размера файла на сервере
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST \
          "ls -lh $DEPLOY_PATH/dostavimvse.jar && echo '✅ File uploaded successfully'"
        
        # Перезапуск приложения (если используется systemd)
        echo "🔄 Restarting application..."
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST \
          "sudo systemctl restart dostavimvse && echo '✅ Service restarted' || echo '⚠️  Service not found or restart failed'"
        
        # Проверка статуса приложения
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST \
          "sudo systemctl status dostavimvse --no-pager -l || echo '⚠️  Service status unavailable'" || true
        
        echo "✅ Deployment completed successfully!"

